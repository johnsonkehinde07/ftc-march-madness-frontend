<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>FTC · BUY TICKETS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ===== RESET & BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-red: #8B1E1E;
      --secondary-gold: #C69C6D;
      --dark-charcoal: #1A1212;
      --off-white: #F5E6D3;
      --accent-burgundy: #5C1A1A;
      --metal: #2A2A2A;
      --sand: #DCC7B0;
      --glimmer: #E6B17E;
      --sold-out: #4a4a4a;
      --sold-out-text: #888;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--dark-charcoal);
      color: var(--off-white);
      line-height: 1.5;
      min-height: 100vh;
      padding: 0;
      margin: 0;
    }

    /* ===== HEADER ===== */
    .logo-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      background: rgba(26, 18, 18, 0.98);
      border-bottom: 3px solid var(--primary-red);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-img {
      height: 48px;
      width: auto;
      border-radius: 4px;
      border: 2px solid var(--secondary-gold);
    }

    .logo-text-wrapper {
      display: flex;
      flex-direction: column;
    }

    .logo-ftc {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--secondary-gold);
      letter-spacing: 2px;
    }

    .logo-event {
      font-size: 1rem;
      font-weight: 600;
      color: var(--off-white);
    }

    .back-link {
      color: var(--secondary-gold);
      text-decoration: none;
      font-size: 0.9rem;
      border: 1px solid var(--primary-red);
      padding: 6px 12px;
    }

    /* ===== MAIN CONTAINER ===== */
    .tickets-container {
      max-width: 500px;
      margin: 0 auto;
      padding: 20px 16px 30px;
    }

    .page-title {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 8px;
      color: var(--secondary-gold);
    }

    .event-date {
      font-size: 0.95rem;
      color: var(--sand);
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(198,156,109,0.3);
    }

    /* ===== TICKET CARDS ===== */
    .ticket-card {
      background: rgba(26, 18, 18, 0.95);
      border: 2px solid var(--primary-red);
      border-radius: 0;
      margin-bottom: 16px;
      padding: 16px;
      transition: all 0.2s ease;
    }

    .ticket-card.available {
      border-color: var(--secondary-gold);
      box-shadow: 0 4px 12px rgba(198,156,109,0.2);
    }

    .ticket-card.sold-out {
      border-color: var(--sold-out);
      opacity: 0.7;
      background: rgba(40, 40, 40, 0.8);
    }

    .ticket-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .ticket-name {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--secondary-gold);
    }

    .ticket-badge {
      background: var(--primary-red);
      color: var(--off-white);
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      border: 1px solid var(--secondary-gold);
    }

    .ticket-badge.sold-out {
      background: var(--sold-out);
      border-color: var(--sold-out-text);
      color: #ccc;
    }

    .ticket-price-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px dashed rgba(198,156,109,0.3);
    }

    .ticket-price {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--off-white);
    }

    .ticket-price small {
      font-size: 0.9rem;
      font-weight: 400;
      color: var(--sand);
    }

    .ticket-fee {
      font-size: 0.85rem;
      color: var(--sand);
    }

    .ticket-description {
      font-size: 0.9rem;
      color: var(--sand);
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .ticket-stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 0.9rem;
    }

    .tickets-left {
      background: rgba(139,30,30,0.3);
      padding: 6px 12px;
      border-left: 3px solid var(--secondary-gold);
    }

    .tickets-left strong {
      color: var(--secondary-gold);
      font-size: 1.2rem;
      margin-right: 4px;
    }

    .btn-buy {
      width: 100%;
      background: var(--primary-red);
      border: 2px solid var(--secondary-gold);
      color: white;
      padding: 16px;
      font-size: 1.2rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-buy:active {
      transform: scale(0.98);
      background: var(--secondary-gold);
      color: var(--dark-charcoal);
    }

    .btn-buy.sold-out-btn {
      background: var(--sold-out);
      border-color: var(--sold-out-text);
      color: #ccc;
      cursor: not-allowed;
    }

    .btn-buy.sold-out-btn:active {
      transform: none;
    }

    /* ===== QUANTITY SELECTOR (for available tickets) ===== */
    .quantity-selector {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 16px 0;
    }

    .qty-btn {
      width: 44px;
      height: 44px;
      background: var(--primary-red);
      border: 2px solid var(--secondary-gold);
      color: white;
      font-size: 1.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qty-input {
      width: 60px;
      height: 44px;
      text-align: center;
      background: rgba(0,0,0,0.5);
      border: 2px solid var(--primary-red);
      color: white;
      font-size: 1.3rem;
      font-weight: 700;
    }

    /* ===== PAST TICKETS SECTION ===== */
    .past-tickets-section {
      margin-top: 30px;
    }

    .section-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--sand);
      margin-bottom: 16px;
      letter-spacing: 1px;
    }

    .past-ticket-card {
      background: rgba(20, 20, 20, 0.8);
      border: 1px solid var(--metal);
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      opacity: 0.6;
    }

    .past-ticket-name {
      font-weight: 600;
      color: var(--sand);
    }

    .past-ticket-price {
      color: var(--sand);
      text-decoration: line-through;
    }

    .past-ticket-badge {
      background: var(--metal);
      color: #aaa;
      padding: 4px 8px;
      font-size: 0.7rem;
    }

    /* ===== CUSTOMER FORM ===== */
    .customer-form {
      margin-top: 30px;
      background: rgba(26, 18, 18, 0.98);
      border: 3px solid var(--primary-red);
      padding: 24px 16px;
    }

    .form-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--secondary-gold);
      text-align: center;
    }

    input {
      width: 100%;
      padding: 16px;
      margin-bottom: 16px;
      background: rgba(0,0,0,0.5);
      border: 2px solid var(--primary-red);
      color: var(--off-white);
      font-size: 1rem;
    }

    input:focus {
      outline: none;
      border-color: var(--secondary-gold);
    }

    .form-notice {
      background: rgba(139,30,30,0.2);
      border: 1px solid var(--primary-red);
      padding: 12px;
      margin: 20px 0;
      text-align: center;
      color: var(--sand);
      font-size: 0.9rem;
    }

    .submit-btn {
      width: 100%;
      background: var(--primary-red);
      border: 2px solid var(--secondary-gold);
      color: white;
      padding: 18px;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
    }

    .footer {
      text-align: center;
      padding: 24px 16px;
      font-size: 0.8rem;
      color: var(--sand);
      border-top: 1px solid rgba(198,156,109,0.2);
      margin-top: 20px;
    }

    .social-links a {
      color: var(--secondary-gold);
      margin: 0 10px;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <header class="logo-header">
    <div class="logo-group">
      <img src="pictures/logo.jpeg" alt="FTC" class="logo-img">
      <div class="logo-text-wrapper">
        <span class="logo-ftc">FTC</span>
        <span class="logo-event">MARCH MADNESS</span>
      </div>
    </div>
    <a href="index.html" class="back-link">
      <i class="fas fa-arrow-left"></i> BACK
    </a>
  </header>

  <div class="tickets-container">
    <h1 class="page-title">BUY TICKETS</h1>
    <div class="event-date">MARCH 7, 2026 · KODO BEACH HOUSE</div>

    <!-- Ticket Cards will be injected here by JavaScript -->
    <div id="ticketsList"></div>

    <!-- Customer Form -->
    <div class="customer-form" id="customerForm" style="display: none;">
      <div class="form-title" id="selectedTicketName">COMPLETE PURCHASE</div>
      
      <form id="ticketForm">
        <input type="hidden" id="selectedTicketType">
        <input type="hidden" id="selectedTicketPrice">
        
        <input type="text" id="name" placeholder="FULL NAME" required>
        <input type="email" id="email" placeholder="EMAIL ADDRESS" required>
        <input type="tel" id="phone" placeholder="PHONE NUMBER (OPTIONAL)">
        
        <div class="quantity-selector">
          <button type="button" class="qty-btn" id="decreaseQty">−</button>
          <input type="number" id="quantity" value="1" min="1" max="10" readonly class="qty-input">
          <button type="button" class="qty-btn" id="increaseQty">+</button>
        </div>
        
        <div class="form-notice" id="totalDisplay">
          Total: ₦0
        </div>
        
        <button type="submit" class="submit-btn" id="submitBtn">
          PROCEED TO PAYMENT
        </button>
      </form>
    </div>
  </div>

  <footer class="footer">
    <div class="social-links">
      <a href="https://www.instagram.com/freedomtocreate_"><i class="fab fa-instagram"></i></a>
    </div>
    <p>FTC · MARCH MADNESS · support@ftcmarch.com</p>
  </footer>

  <script>
    // ========== FETCH TICKET TYPES ==========
    const ticketsList = document.getElementById('ticketsList');
    const customerForm = document.getElementById('customerForm');
    const selectedTicketName = document.getElementById('selectedTicketName');
    const selectedTicketType = document.getElementById('selectedTicketType');
    const selectedTicketPrice = document.getElementById('selectedTicketPrice');
    const quantityInput = document.getElementById('quantity');
    const decreaseBtn = document.getElementById('decreaseQty');
    const increaseBtn = document.getElementById('increaseQty');
    const totalDisplay = document.getElementById('totalDisplay');
    const submitBtn = document.getElementById('submitBtn');

    let currentTicket = null;
    let allTicketTypes = [];

    // Sample past tickets (these would ideally come from your backend)
    const pastTickets = [
      { name: 'FAST FAST', price: 7000, status: 'sold-out' },
      { name: 'WINNERS FC', price: 8000, status: 'sold-out' }
    ];

    function renderTickets(types) {
      let html = '';
      
      // Active tickets
      types.forEach(ticket => {
        const available = ticket.available || 0;
        const isAvailable = available > 0;
        
        html += `
          <div class="ticket-card ${isAvailable ? 'available' : 'sold-out'}" data-ticket='${JSON.stringify(ticket)}'>
            <div class="ticket-header">
              <span class="ticket-name">${ticket.name}</span>
              <span class="ticket-badge ${!isAvailable ? 'sold-out' : ''}">${isAvailable ? 'AVAILABLE' : 'SOLD OUT'}</span>
            </div>
            <div class="ticket-price-row">
              <span class="ticket-price">₦${ticket.price.toLocaleString()} <small>+ ₦300 fee</small></span>
              <span class="ticket-fee">Total: ₦${(ticket.price + 300).toLocaleString()}</span>
            </div>
            <div class="ticket-description">${ticket.description || 'Standard entry ticket'}</div>
            <div class="ticket-stats">
              <span class="tickets-left"><strong>${available}</strong> left of ${ticket.limit}</span>
              ${isAvailable ? 
                `<button class="btn-buy" onclick="selectTicket('${ticket.name}', ${ticket.price}, ${available})">BUY NOW</button>` : 
                `<button class="btn-buy sold-out-btn" disabled>SOLD OUT</button>`}
            </div>
          </div>
        `;
      });

      // Past tickets section
      if (pastTickets.length > 0) {
        html += `<div class="past-tickets-section"><div class="section-title">PAST TICKETS</div>`;
        pastTickets.forEach(ticket => {
          html += `
            <div class="past-ticket-card">
              <span class="past-ticket-name">${ticket.name}</span>
              <span class="past-ticket-price">₦${ticket.price}</span>
              <span class="past-ticket-badge">SOLD OUT</span>
            </div>
          `;
        });
        html += `</div>`;
      }

      ticketsList.innerHTML = html;
    }

    // Global function to handle ticket selection
    window.selectTicket = function(name, price, available) {
      currentTicket = { name, price, available };
      selectedTicketName.innerText = `BUYING: ${name}`;
      selectedTicketType.value = name;
      selectedTicketPrice.value = price;
      quantityInput.value = 1;
      quantityInput.max = Math.min(available, 10);
      updateTotal();
      customerForm.style.display = 'block';
      window.scrollTo({ top: customerForm.offsetTop - 100, behavior: 'smooth' });
    };

    function updateTotal() {
      if (!currentTicket) return;
      const qty = parseInt(quantityInput.value) || 1;
      const total = (currentTicket.price * qty) + 300;
      totalDisplay.innerHTML = `Total: ₦${total.toLocaleString()} for ${qty} ticket(s)`;
    }

    // Quantity buttons
    decreaseBtn.addEventListener('click', () => {
      let val = parseInt(quantityInput.value);
      if (val > 1) {
        quantityInput.value = val - 1;
        updateTotal();
      }
    });

    increaseBtn.addEventListener('click', () => {
      let val = parseInt(quantityInput.value);
      if (currentTicket && val < currentTicket.available && val < 10) {
        quantityInput.value = val + 1;
        updateTotal();
      } else if (currentTicket && val >= currentTicket.available) {
        alert(`Only ${currentTicket.available} tickets available`);
      }
    });

    // Fetch real ticket types from backend
    fetch('https://ftc-march-madness-backend-1.onrender.com/api/tickets/types')
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          allTicketTypes = data.data;
          renderTickets(allTicketTypes);
        } else {
          // Fallback demo data
          renderTickets([
            { name: 'RUNNER UP', price: 8700, available: 50, limit: 50, description: 'Main event ticket' }
          ]);
        }
      })
      .catch(err => {
        console.error('Error loading tickets:', err);
        // Fallback demo data
        renderTickets([
          { name: 'RUNNER UP', price: 8700, available: 50, limit: 50, description: 'Main event ticket' }
        ]);
      });

    // Form submission
    document.getElementById('ticketForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const ticketType = selectedTicketType.value;
      const quantity = parseInt(quantityInput.value);

      if (!name || !email || !ticketType) {
        alert('Please fill in all required fields');
        return;
      }

      if (!email.includes('@') || !email.includes('.')) {
        alert('Please enter a valid email address');
        return;
      }

      submitBtn.innerHTML = 'PROCESSING...';
      submitBtn.disabled = true;

      try {
        const response = await fetch('https://ftc-march-madness-backend-1.onrender.com/api/tickets/purchase', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, phone, ticketType, quantity })
        });

        const data = await response.json();

        if (data.success) {
          sessionStorage.setItem('pendingTicket', JSON.stringify({
            bulkOrderId: data.data.bulkOrderId,
            quantity,
            name,
            email,
            ticketType
          }));
          window.location.href = data.data.authorization_url;
        } else {
          alert('Error: ' + data.message);
          submitBtn.innerHTML = 'PROCEED TO PAYMENT';
          submitBtn.disabled = false;
        }
      } catch (error) {
        alert('Network error. Please try again.');
        submitBtn.innerHTML = 'PROCEED TO PAYMENT';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
