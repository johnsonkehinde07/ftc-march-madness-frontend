
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>FTC Ticketing · Checkout</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0A0A0A;
            --primary-light: #1A1A1A;
            --accent: #C62828;
            --accent-light: #EF5350;
            --accent-glow: rgba(198, 40, 40, 0.4);
            --gold: #D4AF37;
            --text-primary: #FFFFFF;
            --text-secondary: #A0A0A0;
            --text-muted: #6B6B6B;
            --border: #2A2A2A;
            --card-bg: rgba(20, 20, 20, 0.95);
            --gradient-accent: linear-gradient(135deg, #C62828 0%, #8B0000 100%);
            --shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 10px 40px rgba(0, 0, 0, 0.4);
            --shadow-accent: 0 0 30px rgba(198, 40, 40, 0.3);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--primary);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--primary-light);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 4px;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Navbar */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 16px 5%;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--gradient-accent);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.3rem;
            color: white;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 800;
            color: white;
            letter-spacing: -1px;
        }

        .logo-text span {
            color: var(--accent);
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: var(--accent);
        }

        /* Main Container */
        .checkout-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 5%;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 40px;
        }

        /* Ticket Selection */
        .ticket-section {
            animation: fadeInUp 0.6s ease;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .section-subtitle {
            color: var(--text-secondary);
            margin-bottom: 32px;
            font-size: 1rem;
        }

        .ticket-cards {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .ticket-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .ticket-card:hover {
            border-color: var(--accent);
            transform: translateX(5px);
        }

        .ticket-card.selected {
            border-color: var(--accent);
            background: rgba(198, 40, 40, 0.05);
            box-shadow: var(--shadow-accent);
        }

        .ticket-card.sold-out {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .ticket-card.sold-out:hover {
            transform: none;
        }

        .sold-out-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--accent);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .ticket-name {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .ticket-price {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent);
        }

        .ticket-price small {
            font-size: 0.9rem;
            font-weight: 400;
            color: var(--text-muted);
        }

        .ticket-desc {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .ticket-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ticket-availability {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .ticket-availability strong {
            color: var(--accent);
        }

        .select-btn {
            padding: 8px 24px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .select-btn:hover {
            border-color: var(--accent);
            background: rgba(198, 40, 40, 0.1);
        }

        /* Customer Form */
        .form-section {
            animation: fadeInUp 0.6s ease 0.2s backwards;
        }

        .order-summary {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            position: sticky;
            top: 100px;
        }

        .summary-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .selected-ticket {
            background: rgba(198, 40, 40, 0.1);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .selected-ticket-name {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .selected-ticket-price {
            color: var(--accent);
            font-weight: 700;
        }

        .quantity-selector {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px 0;
            padding: 16px 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .qty-btn {
            width: 36px;
            height: 36px;
            background: var(--primary-light);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .qty-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .qty-value {
            font-size: 1.2rem;
            font-weight: 600;
            min-width: 40px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: var(--primary-light);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            margin: 16px 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .total-label {
            font-weight: 600;
        }

        .total-amount {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent);
        }

        .fee-note {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 20px;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: var(--gradient-accent);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-accent);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .secure-badge {
            text-align: center;
            margin-top: 20px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .secure-badge i {
            color: var(--accent);
            margin-right: 5px;
        }

        /* Loading Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* Responsive */
        @media (max-width: 968px) {
            .checkout-container {
                grid-template-columns: 1fr;
            }

            .order-summary {
                position: static;
            }

            .section-title {
                font-size: 1.5rem;
            }

            .ticket-price {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <div class="logo-icon">F</div>
                <div class="logo-text">FTC<span>.</span></div>
            </a>
            <a href="index.html" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="checkout-container">
        <!-- Left: Ticket Selection -->
        <div class="ticket-section">
            <h1 class="section-title">Select your ticket</h1>
            <p class="section-subtitle">Choose from available ticket types below</p>

            <div class="ticket-cards" id="ticketList">
                <div style="text-align: center; padding: 50px;">
                    <div class="spinner" style="margin: 0 auto 15px;"></div>
                    <p>Loading tickets...</p>
                </div>
            </div>
        </div>

        <!-- Right: Order Summary & Form -->
        <div class="form-section">
            <div class="order-summary">
                <div class="summary-title">Order Summary</div>

                <div id="selectedTicketDisplay">
                    <div style="text-align: center; padding: 30px; color: var(--text-muted);">
                        <i class="fas fa-ticket-alt" style="font-size: 2rem; margin-bottom: 10px; display: block;"></i>
                        Select a ticket to continue
                    </div>
                </div>

                <div id="customerForm" style="display: none;">
                    <div class="selected-ticket">
                        <div class="selected-ticket-name" id="selectedName">-</div>
                        <div class="selected-ticket-price" id="selectedPrice">-</div>
                    </div>

                    <div class="quantity-selector">
                        <span>Quantity</span>
                        <div class="qty-controls">
                            <button class="qty-btn" id="decreaseQty">−</button>
                            <span class="qty-value" id="qtyValue">1</span>
                            <button class="qty-btn" id="increaseQty">+</button>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Full Name</label>
                        <input type="text" id="name" placeholder="Enter your full name">
                    </div>

                    <div class="input-group">
                        <label>Email Address</label>
                        <input type="email" id="email" placeholder="you@example.com">
                    </div>

                    <div class="input-group">
                        <label>Phone Number (Optional)</label>
                        <input type="tel" id="phone" placeholder="+234 123 456 7890">
                    </div>

                    <div class="total-row">
                        <span class="total-label">Total</span>
                        <span class="total-amount" id="totalAmount">₦0</span>
                    </div>

                    <div class="fee-note">
                        <i class="fas fa-info-circle"></i> ₦300 processing fee included
                    </div>

                    <button class="submit-btn" id="submitBtn">
                        <i class="fas fa-lock"></i> Proceed to Payment
                    </button>

                    <div class="secure-badge">
                        <i class="fas fa-shield-alt"></i> Secured by Paystack
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // State
        let tickets = [];
        let selectedTicket = null;
        let quantity = 1;
        let submitting = false;

        // DOM Elements
        const ticketList = document.getElementById('ticketList');
        const selectedTicketDisplay = document.getElementById('selectedTicketDisplay');
        const customerForm = document.getElementById('customerForm');
        const selectedName = document.getElementById('selectedName');
        const selectedPrice = document.getElementById('selectedPrice');
        const qtyValue = document.getElementById('qtyValue');
        const totalAmount = document.getElementById('totalAmount');
        const submitBtn = document.getElementById('submitBtn');
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const phoneInput = document.getElementById('phone');

        // Fetch tickets
        async function loadTickets() {
            try {
                const response = await fetch('https://ftc-march-madness-backend-1.onrender.com/api/tickets/types');
                const data = await response.json();

                if (data.success && data.data.length > 0) {
                    tickets = data.data;
                    renderTickets();
                } else {
                    ticketList.innerHTML = `
                        <div style="text-align: center; padding: 50px; color: var(--text-muted);">
                            <i class="fas fa-ban" style="font-size: 2rem; margin-bottom: 10px; display: block;"></i>
                            <p>No tickets available at the moment</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading tickets:', error);
                ticketList.innerHTML = `
                    <div style="text-align: center; padding: 50px; color: var(--text-muted);">
                        <i class="fas fa-exclamation-triangle" style="font-size: 2rem; margin-bottom: 10px; display: block;"></i>
                        <p>Error loading tickets. Please refresh the page.</p>
                    </div>
                `;
            }
        }

        function renderTickets() {
            ticketList.innerHTML = tickets.map(ticket => `
                <div class="ticket-card ${ticket.available === 0 ? 'sold-out' : ''}" data-ticket='${JSON.stringify(ticket)}'>
                    ${ticket.available === 0 ? '<div class="sold-out-badge">SOLD OUT</div>' : ''}
                    <div class="ticket-header">
                        <div class="ticket-name">${ticket.name}</div>
                        <div class="ticket-price">₦${ticket.price.toLocaleString()}<small> + fee</small></div>
                    </div>
                    <div class="ticket-desc">${ticket.description || 'Standard entry ticket'}</div>
                    <div class="ticket-footer">
                        <div class="ticket-availability">
                            <strong>${ticket.available}</strong> tickets left
                        </div>
                        ${ticket.available > 0 ? 
                            `<button class="select-btn" onclick="selectTicket('${ticket.name}')">Select Ticket</button>` : 
                            `<button class="select-btn" style="opacity:0.5;" disabled>Sold Out</button>`
                        }
                    </div>
                </div>
            `).join('');
        }

        // Select ticket (global for onclick)
        window.selectTicket = function(ticketName) {
            const ticket = tickets.find(t => t.name === ticketName);
            if (!ticket || ticket.available === 0) return;

            selectedTicket = ticket;
            quantity = 1;
            updateSelectedDisplay();
            
            customerForm.style.display = 'block';
            selectedTicketDisplay.innerHTML = '';
            
            // Scroll to form
            customerForm.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };

        function updateSelectedDisplay() {
            if (!selectedTicket) return;
            
            const price = selectedTicket.price;
            const total = (price * quantity) + 300;
            
            selectedName.textContent = `${selectedTicket.name} x${quantity}`;
            selectedPrice.textContent = `₦${price.toLocaleString()} each`;
            qtyValue.textContent = quantity;
            totalAmount.textContent = `₦${total.toLocaleString()}`;
        }

        // Quantity controls
        document.getElementById('decreaseQty').addEventListener('click', () => {
            if (quantity > 1) {
                quantity--;
                updateSelectedDisplay();
            }
        });

        document.getElementById('increaseQty').addEventListener('click', () => {
            if (selectedTicket && quantity < selectedTicket.available && quantity < 10) {
                quantity++;
                updateSelectedDisplay();
            } else if (selectedTicket && quantity >= selectedTicket.available) {
                alert(`Only ${selectedTicket.available} tickets available`);
            }
        });

        // Form submission
        submitBtn.addEventListener('click', async () => {
            if (submitting) return;
            
            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const phone = phoneInput.value.trim();

            if (!name) {
                alert('Please enter your full name');
                return;
            }

            if (!email || !email.includes('@') || !email.includes('.')) {
                alert('Please enter a valid email address');
                return;
            }

            if (!selectedTicket) {
                alert('Please select a ticket type');
                return;
            }

            submitting = true;
            submitBtn.innerHTML = '<div class="spinner"></div> Processing...';
            submitBtn.disabled = true;

            try {
                const response = await fetch('https://ftc-march-madness-backend-1.onrender.com/api/tickets/purchase', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name,
                        email,
                        phone,
                        ticketType: selectedTicket.name,
                        quantity
                    })
                });

                const data = await response.json();

                if (data.success) {
                    sessionStorage.setItem('pendingTicket', JSON.stringify({
                        bulkOrderId: data.data.bulkOrderId,
                        quantity,
                        name,
                        email,
                        ticketType: selectedTicket.name
                    }));
                    window.location.href = data.data.authorization_url;
                } else {
                    alert('Error: ' + data.message);
                    submitting = false;
                    submitBtn.innerHTML = '<i class="fas fa-lock"></i> Proceed to Payment';
                    submitBtn.disabled = false;
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Network error. Please try again.');
                submitting = false;
                submitBtn.innerHTML = '<i class="fas fa-lock"></i> Proceed to Payment';
                submitBtn.disabled = false;
            }
        });

        // Check payment return
        (function checkPaymentReturn() {
            const urlParams = new URLSearchParams(window.location.search);
            const reference = urlParams.get('reference') || urlParams.get('trxref');
            
            if (!reference) return;
            
            document.body.innerHTML = `
                <div style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background: var(--primary);">
                    <div style="text-align: center;">
                        <div class="spinner" style="width: 50px; height: 50px; margin: 0 auto 20px;"></div>
                        <h2>Verifying your payment...</h2>
                        <p style="color: var(--text-muted); margin-top: 10px;">Please wait, this may take a few seconds</p>
                    </div>
                </div>
            `;
            
            fetch('https://ftc-march-madness-backend-1.onrender.com/api/tickets/verify-payment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ reference })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    sessionStorage.setItem('ticketData', JSON.stringify(data.data));
                    window.location.href = 'success.html';
                } else {
                    const pending = sessionStorage.getItem('pendingTicket');
                    if (pending) {
                        sessionStorage.setItem('ticketData', pending);
                        window.location.href = 'success.html';
                    } else {
                        window.location.href = 'fail.html';
                    }
                }
            })
            .catch(() => {
                const pending = sessionStorage.getItem('pendingTicket');
                if (pending) {
                    sessionStorage.setItem('ticketData', pending);
                    window.location.href = 'success.html';
                } else {
                    window.location.href = 'fail.html';
                }
            });
        })();

        // Load tickets on page load
        loadTickets();
    </script>
</body>
</html>
