<script>
    // ========== FETCH AVAILABILITY ==========
    let ticketPrice = 7000; // Default price
    
    fetch('https://ftc-march-madness-backend-1.onrender.com/api/tickets/availability')
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          ticketPrice = data.data.price;
          const available = data.data.available;
          
          document.getElementById('priceTag').innerHTML = `<i class="fas fa-clock"></i> FAST FAST · ₦${ticketPrice.toLocaleString()}`;
          document.getElementById('availabilityNotice').innerHTML = `<i class="fas fa-info-circle"></i> ${available} tickets left · FAST FAST`;
          
          // Update button with current quantity
          const quantity = parseInt(document.getElementById('quantity').value);
          const total = (ticketPrice * quantity) + 300;
          document.getElementById('submitBtn').innerHTML = `<i class="fas fa-lock"></i> PAY ₦${total.toLocaleString()} for ${quantity} ticket(s)`;
          
          if (available <= 0) {
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('submitBtn').innerHTML = 'SOLD OUT';
            document.getElementById('availabilityNotice').innerHTML = '<i class="fas fa-exclamation-circle"></i> Sorry, tickets are sold out';
          }
        }
      })
      .catch(error => {
        console.error('Error:', error);
        document.getElementById('priceTag').innerHTML = '<i class="fas fa-clock"></i> FAST FAST · ₦7,000';
        document.getElementById('availabilityNotice').innerHTML = '<i class="fas fa-info-circle"></i> FAST FAST · limited tickets';
        
        // Update button with default price
        const quantity = parseInt(document.getElementById('quantity').value);
        const total = (7000 * quantity) + 300;
        document.getElementById('submitBtn').innerHTML = `<i class="fas fa-lock"></i> PAY ₦${total.toLocaleString()} for ${quantity} ticket(s)`;
      });

    // ========== QUANTITY SELECTOR ==========
    const quantityInput = document.getElementById('quantity');
    const decreaseBtn = document.getElementById('decreaseQty');
    const increaseBtn = document.getElementById('increaseQty');
    const submitBtn = document.getElementById('submitBtn');

    function updateTotalPrice() {
      const quantity = parseInt(quantityInput.value);
      const price = ticketPrice || 7000; // Use fetched price or default
      const total = (price * quantity) + 300;
      submitBtn.innerHTML = `<i class="fas fa-lock"></i> PAY ₦${total.toLocaleString()} for ${quantity} ticket(s)`;
      console.log('Updated total:', total, 'for', quantity, 'tickets');
    }

    decreaseBtn.addEventListener('click', () => {
      let val = parseInt(quantityInput.value);
      if (val > 1) {
        val -= 1;
        quantityInput.value = val;
        updateTotalPrice();
      }
    });

    increaseBtn.addEventListener('click', () => {
      let val = parseInt(quantityInput.value);
      if (val < 10) {
        val += 1;
        quantityInput.value = val;
        updateTotalPrice();
      }
    });

    // ========== HANDLE FORM SUBMISSION ==========
    document.getElementById('ticketForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const quantity = parseInt(document.getElementById('quantity').value);
      const ticketType = 'FAST FAST';
      
      const submitBtn = document.getElementById('submitBtn');
      const originalText = submitBtn.innerHTML;
      
      if (!email.includes('@') || !email.includes('.')) {
        alert('Please enter a valid email address');
        return;
      }
      
      if (name.length < 2) {
        alert('Please enter your full name');
        return;
      }
      
      // Show correct total in button
      const total = (ticketPrice * quantity) + 300;
      submitBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> PROCESSING ₦${total.toLocaleString()}...`;
      submitBtn.disabled = true;
      
      try {
        console.log('📤 Sending purchase request:', { name, email, phone, ticketType, quantity });
        
        const response = await fetch('https://ftc-march-madness-backend-1.onrender.com/api/tickets/purchase', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            name, 
            email, 
            phone, 
            ticketType,
            quantity
          })
        });
        
        const data = await response.json();
        console.log('📥 Purchase response:', data);
        
        if (data.success) {
          sessionStorage.setItem('pendingTicket', JSON.stringify({
            bulkOrderId: data.data.bulkOrderId,
            quantity: data.data.quantity,
            name: name,
            email: email,
            ticketType: 'FAST FAST'
          }));
          window.location.href = data.data.authorization_url;
        } else {
          alert('Error: ' + data.message);
          submitBtn.innerHTML = originalText;
          submitBtn.disabled = false;
        }
      } catch (error) {
        console.error('❌ Error:', error);
        alert('Network error. Please check your connection and try again.');
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
      }
    });

    // ========== CHECK PAYMENT RETURN ==========
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const reference = urlParams.get('reference') || urlParams.get('trxref');
      
      if (!reference) return;
      
      console.log('🔄 Payment return detected. Reference:', reference);
      
      document.getElementById('priceTag').innerHTML = '<i class="fas fa-spinner fa-spin"></i> VERIFYING PAYMENT...';
      document.getElementById('submitBtn').disabled = true;
      window.history.replaceState({}, document.title, window.location.pathname);
      
      let verified = false;
      
      fetch('https://ftc-march-madness-backend-1.onrender.com/api/tickets/verify-payment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reference: reference })
      })
      .then(response => response.json())
      .then(data => {
        verified = true;
        console.log('📥 Verification response:', data);
        
        if (data.success) {
          sessionStorage.setItem('ticketData', JSON.stringify(data.data));
          window.location.href = 'success.html';
        } else {
          const pending = sessionStorage.getItem('pendingTicket');
          if (pending) {
            sessionStorage.setItem('ticketData', pending);
            window.location.href = 'success.html';
          } else {
            window.location.href = 'fail.html';
          }
        }
      })
      .catch(error => {
        console.error('❌ Verification error:', error);
        const pending = sessionStorage.getItem('pendingTicket');
        if (pending && !verified) {
          setTimeout(() => {
            window.location.href = 'success.html';
          }, 3000);
        } else {
          window.location.href = 'fail.html';
        }
      });
    })();
  </script>
