<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Processing - FTC</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: #1A1212;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .processing-container {
      text-align: center;
      padding: 60px 40px;
      max-width: 500px;
      width: 100%;
      background: rgba(26, 18, 18, 0.98);
      border: 3px solid #8B1E1E;
      box-shadow: 20px 20px 0 rgba(0,0,0,0.5);
    }
    h1 {
      color: #C69C6D;
      font-size: 2.5rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-bottom: 30px;
    }
    .spinner {
      border: 4px solid rgba(198, 156, 109, 0.2);
      border-top: 4px solid #C69C6D;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
      margin: 30px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="processing-container">
    <h1>VERIFYING<br>PAYMENT</h1>
    <div class="spinner"></div>
    <p style="color: #F5E6D3; margin: 20px 0;">Please wait while we confirm your payment...</p>
  </div>

  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const reference = urlParams.get('reference') || urlParams.get('trxref');
      
      console.log('Payment callback received. Reference:', reference);
      
      if (!reference) {
        window.location.href = '/fail.html?reason=no_reference';
        return;
      }
      
      // Store reference and redirect to buy.html
      sessionStorage.setItem('paymentReference', reference);
      window.location.href = `/buy.html?reference=${reference}`;
    })();
  </script>
</body>
</html>
