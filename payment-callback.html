<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Processing - FTC</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="status-screen">
    <div class="status-icon">⚡</div>
    <h1>VERIFYING<br>PAYMENT</h1>
    <p style="color: #C69C6D; margin: 20px 0;">Please wait...</p>
    <div class="spinner" style="border: 4px solid #f3f3f3; border-top: 4px solid #C69C6D; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 20px auto;"></div>
  </div>

  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const reference = urlParams.get('reference') || urlParams.get('trxref');
    
    if (reference) {
      window.location.href = `https://ftc-march-madness.netlify.app/buy.html?reference=${reference}`;
    } else {
      window.location.href = 'https://ftc-march-madness.netlify.app/fail.html';
    }
  </script>
</body>
</html>
