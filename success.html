<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FTC · TICKET CONFIRMED</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .short-code {
      background: #333;
      padding: 15px;
      text-align: center;
      border: 3px solid #C69C6D;
      margin: 20px 0;
    }
    .short-code .code {
      font-size: 48px;
      font-weight: bold;
      letter-spacing: 8px;
      color: white;
      font-family: monospace;
    }
  </style>
</head>
<body class="status-page">

  <header class="logo-header">
    <div class="logo-group">
      <img src="pictures/logo.jpeg" alt="FTC MARCH MADNESS" class="logo-img">
      <div class="logo-text-wrapper">
        <span class="logo-ftc">FTC</span>
        <span class="logo-presents">presents</span>
        <span class="logo-event">MARCH MADNESS</span>
      </div>
    </div>
  </header>

  <div class="status-screen success" id="ticketInfo">
    <div class="status-icon">
      👑
    </div>
    <h1>TICKET<br>CONFIRMED</h1>
    <div class="status-message" id="ticketMessage">
      LOADING TICKET DETAILS...
    </div>
    <hr>
    <div class="ticket-details" id="ticketDetails">
      <!-- Ticket details will be inserted here -->
    </div>
    <a href="index.html" class="btn status-btn">
      <i class="fas fa-home"></i> RETURN HOME
    </a>
  </div>

  <footer>
    <p>FTC · MARCH MADNESS · MARCH 7TH 2026 · KODO BEACH HOUSE</p>
  </footer>

  <script>
    // Get ticket data from session storage
    const ticketData = JSON.parse(sessionStorage.getItem('ticketData'));
    
    if (ticketData) {
      document.getElementById('ticketMessage').innerHTML = 'YOUR TICKET IS CONFIRMED';
      
      let ticketHtml = '<div style="background: rgba(139,30,30,0.2); border: 2px solid #8B1E1E; padding: 20px; margin: 20px 0; text-align: left;">';
      
      // Check if it's multiple tickets
      if (ticketData.count && ticketData.count > 1) {
        ticketHtml += `<p><strong>TOTAL TICKETS:</strong> ${ticketData.count}</p>`;
        if (ticketData.tickets) {
          ticketData.tickets.forEach(t => {
            const shortCode = t.shortCode || t.ticketId.slice(-6);
            ticketHtml += `
              <div class="short-code">
                <p style="color: #C69C6D;">SHORT CODE</p>
                <p class="code">${shortCode}</p>
              </div>
              <p><strong>TICKET ID:</strong> ${t.ticketId}</p>
              <p><strong>NAME:</strong> ${t.name}</p>
              <p><strong>TYPE:</strong> ${t.ticketType || 'RUNNER UP'}</p>
              <hr style="border-color: #8B1E1E; opacity: 0.3;">
            `;
          });
        }
      } else {
        // Single ticket
        const ticket = ticketData.tickets ? ticketData.tickets[0] : ticketData;
        const shortCode = ticket.shortCode || ticket.ticketId.slice(-6);
        ticketHtml += `
          <div class="short-code">
            <p style="color: #C69C6D;">ENTRY CODE</p>
            <p class="code">${shortCode}</p>
          </div>
          <p><strong>TICKET ID:</strong> ${ticket.ticketId}</p>
          <p><strong>NAME:</strong> ${ticket.name}</p>
          <p><strong>EMAIL:</strong> ${ticket.email}</p>
          <p><strong>TICKET TYPE:</strong> ${ticket.ticketType || 'RUNNER UP'}</p>
          <p><strong>PRICE:</strong> ₦${ticket.price || 8700}</p>
        `;
      }
      
      ticketHtml += `</div>
        <p style="color: #C69C6D; margin-bottom: 30px;">⭐ QR CODE HAS BEEN SENT TO YOUR EMAIL ⭐</p>
        <p style="color: #F5E6D3; font-size: 0.9rem;">Check your inbox (and spam folder) for your QR code ticket.</p>
        <p style="color: #F5E6D3; font-size: 0.9rem;">Use the ENTRY CODE above if QR doesn't scan at the gate.</p>
      `;
      
      document.getElementById('ticketDetails').innerHTML = ticketHtml;
    } else {
      document.getElementById('ticketMessage').innerHTML = 'TICKET CONFIRMED';
      document.getElementById('ticketDetails').innerHTML = `
        <p style="margin: 20px 0;">Check your email for ticket details and QR code</p>
        <p style="color: #F5E6D3; font-size: 0.9rem;">If you don't see it within 5 minutes, check your spam folder.</p>
        <p style="color: #F5E6D3; font-size: 0.9rem;">Contact support@ftcmarch.com if you need assistance.</p>
      `;
    }
  </script>
</body>
</html>
