<!DOCTYPE html>
<html>
<head>
  <title>Your Tickets - FTC March Madness</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: #1A1212;
      color: #F5E6D3;
      font-family: 'Inter', Arial, sans-serif;
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 3px solid #8B1E1E;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .logo img {
      height: 50px;
      border: 2px solid #C69C6D;
    }
    .logo span {
      font-size: 1.8rem;
      font-weight: 900;
      color: #C69C6D;
    }
    .back-link {
      color: #C69C6D;
      text-decoration: none;
      border: 1px solid #8B1E1E;
      padding: 8px 15px;
    }
    .ticket-card {
      background: rgba(26, 18, 18, 0.95);
      border: 3px solid #8B1E1E;
      padding: 25px;
      margin-bottom: 20px;
    }
    .ticket-card.valid {
      border-color: #C69C6D;
    }
    .ticket-card.used {
      opacity: 0.7;
      border-color: #666;
    }
    .ticket-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(198,156,109,0.3);
    }
    .ticket-type {
      color: #C69C6D;
      font-weight: 800;
      font-size: 1.3rem;
    }
    .ticket-status {
      background: #8B1E1E;
      padding: 5px 10px;
      font-size: 0.8rem;
    }
    .short-code-box {
      background: #333;
      padding: 15px;
      text-align: center;
      margin: 15px 0;
      border: 2px solid #C69C6D;
    }
    .short-code {
      font-size: 48px;
      font-weight: bold;
      letter-spacing: 8px;
      color: white;
      font-family: monospace;
    }
    .ticket-details {
      margin: 15px 0;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
    }
    .detail-label {
      color: #C69C6D;
      font-weight: 600;
    }
    .detail-value {
      color: #F5E6D3;
    }
    .no-tickets {
      text-align: center;
      padding: 50px;
      background: rgba(26,18,18,0.95);
      border: 3px solid #8B1E1E;
    }
    .footer {
      text-align: center;
      margin-top: 40px;
      padding: 20px;
      color: #DCC7B0;
      font-size: 0.8rem;
      border-top: 1px solid #8B1E1E;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <img src="pictures/logo.jpeg" alt="FTC">
        <span>YOUR TICKETS</span>
      </div>
      <a href="index.html" class="back-link">← BACK</a>
    </div>

    <div id="ticketsContainer" style="min-height: 300px;">
      <div style="text-align: center; padding: 50px;">
        <i class="fas fa-spinner fa-spin fa-3x" style="color: #C69C6D;"></i>
        <p style="margin-top: 20px;">Loading your tickets...</p>
      </div>
    </div>

    <div class="footer">
      <p>FTC · MARCH MADNESS · VALIDATION TERMINAL</p>
    </div>
  </div>

  <script>
    async function loadTickets() {
      const urlParams = new URLSearchParams(window.location.search);
      const email = urlParams.get('email');
      const container = document.getElementById('ticketsContainer');
      
      if (!email) {
        container.innerHTML = `
          <div class="no-tickets">
            <h2 style="color: #C69C6D;">No Email Provided</h2>
            <p style="margin: 20px 0;">Please use the link from your email to view your tickets.</p>
            <a href="index.html" style="color: #C69C6D;">← Back to Home</a>
          </div>
        `;
        return;
      }
      
      try {
        const response = await fetch(`https://ftc-march-madness-backend-1.onrender.com/api/tickets/check/${encodeURIComponent(email)}`);
        const data = await response.json();
        
        if (data.success && data.hasTicket) {
          let html = `<h2 style="color: #C69C6D; margin-bottom: 20px;">Found ${data.count} Ticket(s)</h2>`;
          
          data.data.forEach(ticket => {
            const statusClass = ticket.scanned ? 'used' : 'valid';
            const statusText = ticket.scanned ? 'ALREADY USED' : 'VALID - NOT USED';
            const shortCode = ticket.shortCode || ticket.ticketId.slice(-6);
            
            html += `
              <div class="ticket-card ${statusClass}">
                <div class="ticket-header">
                  <span class="ticket-type">${ticket.ticketType || 'WINNERS FC'}</span>
                  <span class="ticket-status">${statusText}</span>
                </div>
                
                <div class="short-code-box">
                  <p style="color: #C69C6D; margin-bottom: 5px;">ENTRY CODE</p>
                  <p class="short-code">${shortCode}</p>
                  <p style="color: #DCC7B0; margin-top: 10px;">Use this at the gate if QR doesn't scan</p>
                </div>
                
                <div class="ticket-details">
                  <div class="detail-row">
                    <span class="detail-label">Ticket ID:</span>
                    <span class="detail-value">${ticket.ticketId}</span>
                  </div>
                  <div class="detail-row">
                    <span class="detail-label">Name:</span>
                    <span class="detail-value">${ticket.name}</span>
                  </div>
                  <div class="detail-row">
                    <span class="detail-label">Status:</span>
                    <span class="detail-value">${ticket.scanned ? 'Used on ' + new Date(ticket.scannedAt).toLocaleString() : 'Not used'}</span>
                  </div>
                </div>
              </div>
            `;
          });
          
          html += `
            <div style="text-align: center; margin-top: 30px;">
              <p style="color: #DCC7B0;">QR codes were sent to your email. Present QR code or entry code at the gate.</p>
              <a href="index.html" style="color: #C69C6D; display: inline-block; margin-top: 20px;">← Back to Home</a>
            </div>
          `;
          
          container.innerHTML = html;
        } else {
          container.innerHTML = `
            <div class="no-tickets">
              <h2 style="color: #C69C6D;">No Tickets Found</h2>
              <p style="margin: 20px 0;">No paid tickets found for ${email}</p>
              <a href="buy.html" style="background: #8B1E1E; color: white; padding: 10px 20px; text-decoration: none; border: 2px solid #C69C6D; display: inline-block; margin-top: 20px;">BUY TICKETS</a>
            </div>
          `;
        }
      } catch (error) {
        console.error('Error loading tickets:', error);
        container.innerHTML = `
          <div class="no-tickets">
            <h2 style="color: #C69C6D;">Error Loading Tickets</h2>
            <p style="margin: 20px 0;">Please try again later or contact support.</p>
            <a href="index.html" style="color: #C69C6D;">← Back to Home</a>
          </div>
        `;
      }
    }
    
    loadTickets();
  </script>
</body>
</html>
